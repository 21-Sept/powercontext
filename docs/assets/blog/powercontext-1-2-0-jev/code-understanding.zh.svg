<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">从仓库到可追溯的代码依据</title><desc id="desc">可选实验能力 · 默认关闭 · 与项目记忆分开存储</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5c6a7c" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#14213a}.muted{fill:#5c6a7c}</style>
<rect width="1000" height="1190" rx="18" fill="#f7f5ef"/>
<text x="48" y="40" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext  /  v1.2.0</text>
<text x="48" y="88" font-size="34" font-weight="700" style="fill:#14213a">从仓库到可追溯的代码依据</text>
<text x="48" y="126" font-size="20" font-weight="400" style="fill:#5c6a7c">可选实验能力 · 默认关闭 · 与项目记忆分开存储</text>
<rect x="48" y="162" width="420" height="158" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="72" y="192" font-size="17" font-weight="700" style="fill:#1769d2">01 / 仓库</text>
<text x="72" y="230" font-size="25" font-weight="700" style="fill:#14213a">Git 工作区</text>
<text x="72" y="263" font-size="20" font-weight="400" style="fill:#5c6a7c">Scope 绑定与访问控制</text>
<text x="72" y="292" font-size="20" font-weight="400" style="fill:#5c6a7c">捕获文件内容与指纹</text>
<rect x="532" y="162" width="420" height="158" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="556" y="192" font-size="17" font-weight="700" style="fill:#1769d2">02 / 提取</text>
<text x="556" y="230" font-size="25" font-weight="700" style="fill:#14213a">Tree-sitter</text>
<text x="556" y="263" font-size="20" font-weight="400" style="fill:#5c6a7c">Python · JS / TS · Go</text>
<text x="556" y="292" font-size="20" font-weight="400" style="fill:#5c6a7c">提取定义、符号和引用</text>
<path d="M 468 241 H 532" fill="none" stroke="#5c6a7c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 742 320 V 350 H 258 V 380" fill="none" stroke="#5c6a7c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="380" width="420" height="158" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="72" y="410" font-size="17" font-weight="700" style="fill:#1769d2">03 / 解析</text>
<text x="72" y="448" font-size="25" font-weight="700" style="fill:#14213a">静态关系解析</text>
<text x="72" y="481" font-size="20" font-weight="400" style="fill:#5c6a7c">解析导入、别名与跨文件关系</text>
<text x="72" y="510" font-size="20" font-weight="400" style="fill:#5c6a7c">区分已解析、候选与未解析线索</text>
<rect x="532" y="380" width="420" height="158" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="556" y="410" font-size="17" font-weight="700" style="fill:#1769d2">04 / 索引</text>
<text x="556" y="448" font-size="25" font-weight="700" style="fill:#14213a">SQLite / seekdb</text>
<text x="556" y="481" font-size="20" font-weight="400" style="fill:#5c6a7c">符号、关系、全文索引</text>
<text x="556" y="510" font-size="20" font-weight="400" style="fill:#5c6a7c">可重建缓存；按版本发布</text>
<path d="M 468 459 H 532" fill="none" stroke="#5c6a7c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 742 538 V 570 H 500 V 602" fill="none" stroke="#5c6a7c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="602" width="904" height="144" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="72" y="632" font-size="17" font-weight="700" style="fill:#1769d2">05 / 查询</text>
<text x="72" y="670" font-size="25" font-weight="700" style="fill:#14213a">query_code</text>
<text x="72" y="703" font-size="20" font-weight="400" style="fill:#5c6a7c">定位符号、调用关系与影响线索，读取带出处的源码。</text>
<text x="72" y="732" font-size="20" font-weight="400" style="fill:#5c6a7c">返回路径、行号、内容摘要与版本指纹，便于回到代码核对。</text>
<path d="M 258 746 V 794" fill="none" stroke="#5c6a7c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 742 746 V 794" fill="none" stroke="#5c6a7c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="794" width="420" height="130" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="72" y="836" font-size="25" font-weight="700" style="fill:#14213a">直接交给 Coding Agent</text>
<text x="72" y="869" font-size="20" font-weight="400" style="fill:#5c6a7c">用于调查、修改与测试</text>
<text x="72" y="898" font-size="20" font-weight="400" style="fill:#5c6a7c">候选关系仍需验证</text>
<rect x="532" y="794" width="420" height="130" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="556" y="836" font-size="25" font-weight="700" style="fill:#14213a">include_code: true</text>
<text x="556" y="869" font-size="20" font-weight="400" style="fill:#5c6a7c">上下文包 = 相关记忆 + 少量代码依据</text>
<text x="556" y="898" font-size="20" font-weight="400" style="fill:#5c6a7c">代码不可用时，历史上下文继续交付</text>
<rect x="48" y="970" width="904" height="130" rx="14" fill="#edf2f8" stroke="#cbd3dc"/>
<text x="72" y="1012" font-size="25" font-weight="700" style="fill:#14213a">代码变化后，先更新再查</text>
<text x="72" y="1045" font-size="20" font-weight="400" style="fill:#5c6a7c">409 code_changed → 本机 code sync → 发布新索引 → 重新定位</text>
<text x="72" y="1074" font-size="20" font-weight="400" style="fill:#5c6a7c">复用未变化文件的解析结果，再重新解析全图引用。</text>
<text x="48" y="1162" font-size="17" font-weight="400" style="fill:#5c6a7c">代码关系提供调查线索，最终影响仍需实际测试确认。</text>
</svg>
