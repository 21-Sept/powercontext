<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="title desc" lang="en">
<title id="title">From repository to traceable code evidence</title><desc id="desc">Optional experimental capability · Disabled by default · Separate from Memory</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#5c6a7c" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#14213a}.muted{fill:#5c6a7c}</style>
<rect width="1000" height="1190" rx="18" fill="#f7f5ef"/>
<text x="48" y="40" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext  /  v1.2.0</text>
<text x="48" y="88" font-size="34" font-weight="700" style="fill:#14213a">From repository to traceable code evidence</text>
<text x="48" y="126" font-size="20" font-weight="400" style="fill:#5c6a7c">Optional experimental capability · Disabled by default · Separate from Memory</text>
<rect x="48" y="162" width="420" height="158" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="72" y="192" font-size="17" font-weight="700" style="fill:#1769d2">01 / SOURCE</text>
<text x="72" y="230" font-size="25" font-weight="700" style="fill:#14213a">Git worktree</text>
<text x="72" y="263" font-size="20" font-weight="400" style="fill:#5c6a7c">Scope binding and access control</text>
<text x="72" y="292" font-size="20" font-weight="400" style="fill:#5c6a7c">Capture source content and fingerprints</text>
<rect x="532" y="162" width="420" height="158" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="556" y="192" font-size="17" font-weight="700" style="fill:#1769d2">02 / EXTRACT</text>
<text x="556" y="230" font-size="25" font-weight="700" style="fill:#14213a">Tree-sitter</text>
<text x="556" y="263" font-size="20" font-weight="400" style="fill:#5c6a7c">Python · JS / TS · Go</text>
<text x="556" y="292" font-size="20" font-weight="400" style="fill:#5c6a7c">Extract definitions, symbols, references</text>
<path d="M 468 241 H 532" fill="none" stroke="#5c6a7c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 742 320 V 350 H 258 V 380" fill="none" stroke="#5c6a7c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="380" width="420" height="158" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="72" y="410" font-size="17" font-weight="700" style="fill:#1769d2">03 / RESOLVE</text>
<text x="72" y="448" font-size="25" font-weight="700" style="fill:#14213a">Static relationship resolution</text>
<text x="72" y="481" font-size="20" font-weight="400" style="fill:#5c6a7c">Resolve imports and cross-file links</text>
<text x="72" y="510" font-size="20" font-weight="400" style="fill:#5c6a7c">Resolved / candidate / unresolved</text>
<rect x="532" y="380" width="420" height="158" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="556" y="410" font-size="17" font-weight="700" style="fill:#1769d2">04 / INDEX</text>
<text x="556" y="448" font-size="25" font-weight="700" style="fill:#14213a">SQLite / seekdb</text>
<text x="556" y="481" font-size="20" font-weight="400" style="fill:#5c6a7c">Symbols, relationships, full-text index</text>
<text x="556" y="510" font-size="20" font-weight="400" style="fill:#5c6a7c">Rebuildable cache; versioned generations</text>
<path d="M 468 459 H 532" fill="none" stroke="#5c6a7c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 742 538 V 570 H 500 V 602" fill="none" stroke="#5c6a7c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="602" width="904" height="144" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="72" y="632" font-size="17" font-weight="700" style="fill:#1769d2">05 / QUERY</text>
<text x="72" y="670" font-size="25" font-weight="700" style="fill:#14213a">query_code</text>
<text x="72" y="703" font-size="20" font-weight="400" style="fill:#5c6a7c">Locate symbols, calls and possible impacts; read source with provenance.</text>
<text x="72" y="732" font-size="20" font-weight="400" style="fill:#5c6a7c">Paths, line ranges, hashes and fingerprints let readers verify the evidence.</text>
<path d="M 258 746 V 794" fill="none" stroke="#5c6a7c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 742 746 V 794" fill="none" stroke="#5c6a7c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="794" width="420" height="130" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="72" y="836" font-size="25" font-weight="700" style="fill:#14213a">Directly to the Coding Agent</text>
<text x="72" y="869" font-size="20" font-weight="400" style="fill:#5c6a7c">Investigate, change and test</text>
<text x="72" y="898" font-size="20" font-weight="400" style="fill:#5c6a7c">Candidate relationships need verification</text>
<rect x="532" y="794" width="420" height="130" rx="14" fill="#ffffff" stroke="#cbd3dc"/>
<text x="556" y="836" font-size="25" font-weight="700" style="fill:#14213a">include_code: true</text>
<text x="556" y="869" font-size="20" font-weight="400" style="fill:#5c6a7c">Memory + bounded code evidence</text>
<text x="556" y="898" font-size="20" font-weight="400" style="fill:#5c6a7c">History still delivers if code is unavailable</text>
<rect x="48" y="970" width="904" height="130" rx="14" fill="#edf2f8" stroke="#cbd3dc"/>
<text x="72" y="1012" font-size="25" font-weight="700" style="fill:#14213a">Refresh before querying changed code</text>
<text x="72" y="1045" font-size="20" font-weight="400" style="fill:#5c6a7c">409 code_changed → local code sync → publish index → locate again</text>
<text x="72" y="1074" font-size="20" font-weight="400" style="fill:#5c6a7c">Reuse unchanged syntax facts, then resolve all references again.</text>
<text x="48" y="1162" font-size="17" font-weight="400" style="fill:#5c6a7c">Code relationships are investigative leads; actual tests must confirm the impact.</text>
</svg>
