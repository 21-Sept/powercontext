<text x="381.3333333333333" y="250" font-size="20" font-weight="400" style="fill:#14213a">HTTP / OpenAPI 与</text>
<text x="381.3333333333333" y="279" font-size="20" font-weight="400" style="fill:#14213a">Streamable HTTP MCP</text>
<text x="381.3333333333333" y="308" font-size="20" font-weight="400" style="fill:#14213a">暴露能力。</text>
<rect x="666.6666666666666" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="690.6666666666666" y="198" font-size="22" font-weight="700" style="fill:#1769d2">同一项目</text>
