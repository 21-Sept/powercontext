<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">Codex、Claude Code 等</text>
<text x="72.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">工具按约定采集和召回</text>
<text x="72.0" y="308" font-size="20" font-weight="400" style="fill:#14213a">。</text>
