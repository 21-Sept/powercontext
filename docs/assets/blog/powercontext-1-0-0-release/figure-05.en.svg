<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="512" viewBox="0 0 1000 512" lang="en" role="img" aria-labelledby="title"><title id="title">Organize context around the work</title><rect width="1000" height="512" rx="18" fill="#f7f5ef"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213a}</style>
<text x="48" y="43" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext</text>
<text x="48" y="88" font-size="30" font-weight="700" style="fill:#14213a">Organize context around the work</text>
<rect x="48.0" y="156" width="285.3333333333333" height="256" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Work-centered</text>
<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">Keep goals, progress</text>
<text x="72.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">and evidence</text>
<text x="72.0" y="308" font-size="20" font-weight="400" style="fill:#14213a">connected.</text>
<rect x="357.3333333333333" y="156" width="285.3333333333333" height="256" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="381.3333333333333" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Actionable</text>
<text x="381.3333333333333" y="250" font-size="20" font-weight="400" style="fill:#14213a">Make the next step</text>
<text x="381.3333333333333" y="279" font-size="20" font-weight="400" style="fill:#14213a">and required checks</text>
<text x="381.3333333333333" y="308" font-size="20" font-weight="400" style="fill:#14213a">explicit.</text>
<rect x="666.6666666666666" y="156" width="285.3333333333333" height="256" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="690.6666666666666" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Shared by people and</text>
<text x="690.6666666666666" y="228" font-size="22" font-weight="700" style="fill:#1769d2">agents</text>
<text x="690.6666666666666" y="280" font-size="20" font-weight="400" style="fill:#14213a">Different views</text>
<text x="690.6666666666666" y="309" font-size="20" font-weight="400" style="fill:#14213a">reference the same</text>
<text x="690.6666666666666" y="338" font-size="20" font-weight="400" style="fill:#14213a">version of verifiable</text>
<text x="690.6666666666666" y="367" font-size="20" font-weight="400" style="fill:#14213a">material.</text>
</svg>
