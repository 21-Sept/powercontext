<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="482" viewBox="0 0 1000 482" lang="en" role="img" aria-labelledby="title"><title id="title">Three kinds of continuity</title><rect width="1000" height="482" rx="18" fill="#f7f5ef"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213a}</style>
<text x="48" y="43" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext</text>
<text x="48" y="88" font-size="30" font-weight="700" style="fill:#14213a">Three kinds of continuity</text>
<rect x="48.0" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Runtime continuity</text>
<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">Resume, checkpoints</text>
<text x="72.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">and transcripts</text>
<text x="72.0" y="308" font-size="20" font-weight="400" style="fill:#14213a">within the original</text>
<text x="72.0" y="337" font-size="20" font-weight="400" style="fill:#14213a">Agent Host.</text>
<rect x="357.3333333333333" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="381.3333333333333" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Knowledge continuity</text>
<text x="381.3333333333333" y="250" font-size="20" font-weight="400" style="fill:#14213a">Memory preserves</text>
<text x="381.3333333333333" y="279" font-size="20" font-weight="400" style="fill:#14213a">facts and constraints</text>
<text x="381.3333333333333" y="308" font-size="20" font-weight="400" style="fill:#14213a">for future tasks.</text>
<rect x="666.6666666666666" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="690.6666666666666" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Work continuity</text>
<text x="690.6666666666666" y="250" font-size="20" font-weight="400" style="fill:#14213a">Handoff tells the</text>
<text x="690.6666666666666" y="279" font-size="20" font-weight="400" style="fill:#14213a">next participant how</text>
<text x="690.6666666666666" y="308" font-size="20" font-weight="400" style="fill:#14213a">to continue now.</text>
</svg>
