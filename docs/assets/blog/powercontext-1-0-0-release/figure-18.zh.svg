<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="482" viewBox="0 0 1000 482" lang="zh" role="img" aria-labelledby="title"><title id="title">人与 Agent 协作的项目上下文</title><rect width="1000" height="482" rx="18" fill="#f7f5ef"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213a}</style>
<text x="48" y="43" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext</text>
<text x="48" y="88" font-size="30" font-weight="700" style="fill:#14213a">人与 Agent 协作的项目上下文</text>
<rect x="48.0" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Memory</text>
<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">保存未来仍然有用的事</text>
<text x="72.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">实、约束与决策。</text>
<rect x="357.3333333333333" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="381.3333333333333" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Handoff</text>
<text x="381.3333333333333" y="250" font-size="20" font-weight="400" style="fill:#14213a">携带当前目标、已验证</text>
<text x="381.3333333333333" y="279" font-size="20" font-weight="400" style="fill:#14213a">进展与下一步。</text>
<rect x="666.6666666666666" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="690.6666666666666" y="198" font-size="22" font-weight="700" style="fill:#1769d2">证据</text>
<text x="690.6666666666666" y="250" font-size="20" font-weight="400" style="fill:#14213a">让接手者能够核对来源</text>
<text x="690.6666666666666" y="279" font-size="20" font-weight="400" style="fill:#14213a">和适用范围。</text>
</svg>
