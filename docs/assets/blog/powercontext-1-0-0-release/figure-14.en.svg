<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="541" viewBox="0 0 1000 541" lang="en" role="img" aria-labelledby="title"><title id="title">Three functional acceptance checks</title><rect width="1000" height="541" rx="18" fill="#f7f5ef"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213a}</style>
<text x="48" y="43" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext</text>
<text x="48" y="88" font-size="30" font-weight="700" style="fill:#14213a">Three functional acceptance checks</text>
<rect x="48.0" y="156" width="285.3333333333333" height="285" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">01 Save a decision</text>
<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">Explicitly save a</text>
<text x="72.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">constraint; check the</text>
<text x="72.0" y="308" font-size="20" font-weight="400" style="fill:#14213a">result and sources.</text>
<rect x="357.3333333333333" y="156" width="285.3333333333333" height="285" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="381.3333333333333" y="198" font-size="22" font-weight="700" style="fill:#1769d2">02 Recall in a new</text>
<text x="381.3333333333333" y="228" font-size="22" font-weight="700" style="fill:#1769d2">session</text>
<text x="381.3333333333333" y="280" font-size="20" font-weight="400" style="fill:#14213a">Recall under the same</text>
<text x="381.3333333333333" y="309" font-size="20" font-weight="400" style="fill:#14213a">Scope and verify</text>
<text x="381.3333333333333" y="338" font-size="20" font-weight="400" style="fill:#14213a">against the current</text>
<text x="381.3333333333333" y="367" font-size="20" font-weight="400" style="fill:#14213a">environment.</text>
<rect x="666.6666666666666" y="156" width="285.3333333333333" height="285" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="690.6666666666666" y="198" font-size="22" font-weight="700" style="fill:#1769d2">03 Hand off</text>
<text x="690.6666666666666" y="228" font-size="22" font-weight="700" style="fill:#1769d2">unfinished work</text>
<text x="690.6666666666666" y="280" font-size="20" font-weight="400" style="fill:#14213a">Commit an exact</text>
<text x="690.6666666666666" y="309" font-size="20" font-weight="400" style="fill:#14213a">version; the</text>
<text x="690.6666666666666" y="338" font-size="20" font-weight="400" style="fill:#14213a">recipient checks code</text>
<text x="690.6666666666666" y="367" font-size="20" font-weight="400" style="fill:#14213a">, evidence and</text>
<text x="690.6666666666666" y="396" font-size="20" font-weight="400" style="fill:#14213a">permissions.</text>
</svg>
