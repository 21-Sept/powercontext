<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="483" viewBox="0 0 1000 483" lang="zh" role="img" aria-labelledby="title"><title id="title">LoCoMo：相对完整上下文基线</title><rect width="1000" height="483" rx="18" fill="#f7f5ef"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213a}</style>
<text x="48" y="43" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext</text>
<text x="48" y="88" font-size="30" font-weight="700" style="fill:#14213a">LoCoMo：相对完整上下文基线</text>
<rect x="48.0" y="156" width="285.3333333333333" height="227" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">+37.88 个百分点</text>
<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">问答准确率提高。</text>
<rect x="357.3333333333333" y="156" width="285.3333333333333" height="227" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="381.3333333333333" y="198" font-size="22" font-weight="700" style="fill:#1769d2">约 −91.9%</text>
<text x="381.3333333333333" y="250" font-size="20" font-weight="400" style="fill:#14213a">搜索 p95 延迟降低。</text>
<rect x="666.6666666666666" y="156" width="285.3333333333333" height="227" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="690.6666666666666" y="198" font-size="22" font-weight="700" style="fill:#1769d2">约 −93.7%</text>
<text x="690.6666666666666" y="250" font-size="20" font-weight="400" style="fill:#14213a">单题回答 Token 减少；</text>
<text x="690.6666666666666" y="279" font-size="20" font-weight="400" style="fill:#14213a">不代表系统总成本。</text>
</svg>
