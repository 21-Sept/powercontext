<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="674" viewBox="0 0 1000 674" lang="en" role="img" aria-labelledby="title"><title id="title">Preserve provenance and boundaries</title><rect width="1000" height="674" rx="18" fill="#f7f5ef"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213a}</style>
<text x="48" y="43" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext</text>
<text x="48" y="88" font-size="30" font-weight="700" style="fill:#14213a">Preserve provenance and boundaries</text>
<rect x="48.0" y="156" width="440.0" height="197" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Source</text>
<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">Keep original evidence and</text>
<text x="72.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">citations; distinguish guesses from</text>
<text x="72.0" y="308" font-size="20" font-weight="400" style="fill:#14213a">facts.</text>
<rect x="512.0" y="156" width="440.0" height="197" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="536.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Scope</text>
<text x="536.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">Identify the project, environment</text>
<text x="536.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">and applicable conditions.</text>
<rect x="48.0" y="377" width="440.0" height="197" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="419" font-size="22" font-weight="700" style="fill:#1769d2">Revision</text>
<text x="72.0" y="471" font-size="20" font-weight="400" style="fill:#14213a">Revisions and retirement retain</text>
<text x="72.0" y="500" font-size="20" font-weight="400" style="fill:#14213a">history.</text>
<rect x="512.0" y="377" width="440.0" height="197" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="536.0" y="419" font-size="22" font-weight="700" style="fill:#1769d2">Review</text>
<text x="536.0" y="471" font-size="20" font-weight="400" style="fill:#14213a">Review the practice and evidence</text>
<text x="536.0" y="500" font-size="20" font-weight="400" style="fill:#14213a">before reuse as Experience or</text>
<text x="536.0" y="529" font-size="20" font-weight="400" style="fill:#14213a">Skill.</text>
</svg>
