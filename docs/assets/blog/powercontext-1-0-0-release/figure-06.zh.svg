<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645" lang="zh" role="img" aria-labelledby="title"><title id="title">一份可以接手的工作包</title><rect width="1000" height="645" rx="18" fill="#f7f5ef"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213a}</style>
<text x="48" y="43" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext</text>
<text x="48" y="88" font-size="30" font-weight="700" style="fill:#14213a">一份可以接手的工作包</text>
<rect x="48.0" y="156" width="440.0" height="168" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">目标与范围</text>
<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">说明要完成什么，以及本次不包含什么</text>
<text x="72.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">。</text>
<rect x="512.0" y="156" width="440.0" height="168" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="536.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">已验证</text>
<text x="536.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">记录结果、代码版本、测试条件和证据</text>
<text x="536.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">。</text>
<rect x="48.0" y="348" width="440.0" height="197" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="390" font-size="22" font-weight="700" style="fill:#1769d2">待核实</text>
<text x="72.0" y="442" font-size="20" font-weight="400" style="fill:#14213a">保留阻塞、假设与仍然开放的问题。</text>
<rect x="512.0" y="348" width="440.0" height="197" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="536.0" y="390" font-size="22" font-weight="700" style="fill:#1769d2">下一步</text>
<text x="536.0" y="442" font-size="20" font-weight="400" style="fill:#14213a">接手者核对当前环境和权限，再决定是</text>
<text x="536.0" y="471" font-size="20" font-weight="400" style="fill:#14213a">否接收。</text>
</svg>
