<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="541" viewBox="0 0 1000 541" lang="zh" role="img" aria-labelledby="title"><title id="title">三个功能验收步骤</title><rect width="1000" height="541" rx="18" fill="#f7f5ef"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213a}</style>
<text x="48" y="43" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext</text>
<text x="48" y="88" font-size="30" font-weight="700" style="fill:#14213a">三个功能验收步骤</text>
<rect x="48.0" y="156" width="285.3333333333333" height="285" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">01 保存判断</text>
<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">明确保存约束，检查结</text>
<text x="72.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">果及来源。</text>
<rect x="357.3333333333333" y="156" width="285.3333333333333" height="285" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="381.3333333333333" y="198" font-size="22" font-weight="700" style="fill:#1769d2">02 跨会话召回</text>
<text x="381.3333333333333" y="250" font-size="20" font-weight="400" style="fill:#14213a">同一 Scope 下召回，并</text>
<text x="381.3333333333333" y="279" font-size="20" font-weight="400" style="fill:#14213a">与当前环境核对。</text>
<rect x="666.6666666666666" y="156" width="285.3333333333333" height="285" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="690.6666666666666" y="198" font-size="22" font-weight="700" style="fill:#1769d2">03 交接工作</text>
<text x="690.6666666666666" y="250" font-size="20" font-weight="400" style="fill:#14213a">提交准确版本；接手者</text>
<text x="690.6666666666666" y="279" font-size="20" font-weight="400" style="fill:#14213a">核对代码、证据与权限</text>
<text x="690.6666666666666" y="308" font-size="20" font-weight="400" style="fill:#14213a">。</text>
</svg>
