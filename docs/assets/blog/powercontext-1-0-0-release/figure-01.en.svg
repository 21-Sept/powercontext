<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="482" viewBox="0 0 1000 482" lang="en" role="img" aria-labelledby="title"><title id="title">Keep work moving across handoffs</title><rect width="1000" height="482" rx="18" fill="#f7f5ef"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213a}</style>
<text x="48" y="43" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext</text>
<text x="48" y="88" font-size="30" font-weight="700" style="fill:#14213a">Keep work moving across handoffs</text>
<rect x="48.0" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Yesterday</text>
<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">Change code, run</text>
<text x="72.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">tests, rule out</text>
<text x="72.0" y="308" font-size="20" font-weight="400" style="fill:#14213a">unsuitable</text>
<text x="72.0" y="337" font-size="20" font-weight="400" style="fill:#14213a">approaches.</text>
<rect x="357.3333333333333" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="381.3333333333333" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Handoff</text>
<text x="381.3333333333333" y="250" font-size="20" font-weight="400" style="fill:#14213a">Preserve the goal,</text>
<text x="381.3333333333333" y="279" font-size="20" font-weight="400" style="fill:#14213a">decision evidence and</text>
<text x="381.3333333333333" y="308" font-size="20" font-weight="400" style="fill:#14213a">verified progress.</text>
<rect x="666.6666666666666" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="690.6666666666666" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Today</text>
<text x="690.6666666666666" y="250" font-size="20" font-weight="400" style="fill:#14213a">The next person or</text>
<text x="690.6666666666666" y="279" font-size="20" font-weight="400" style="fill:#14213a">agent checks the</text>
<text x="690.6666666666666" y="308" font-size="20" font-weight="400" style="fill:#14213a">evidence and</text>
<text x="690.6666666666666" y="337" font-size="20" font-weight="400" style="fill:#14213a">continues.</text>
</svg>
