<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645" lang="en" role="img" aria-labelledby="title"><title id="title">A work package someone can act on</title><rect width="1000" height="645" rx="18" fill="#f7f5ef"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213a}</style>
<text x="48" y="43" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext</text>
<text x="48" y="88" font-size="30" font-weight="700" style="fill:#14213a">A work package someone can act on</text>
<rect x="48.0" y="156" width="440.0" height="168" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Goal and scope</text>
<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">State what to complete and what is</text>
<text x="72.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">outside this task.</text>
<rect x="512.0" y="156" width="440.0" height="168" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="536.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">Verified</text>
<text x="536.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">Record results, code version, test</text>
<text x="536.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">conditions and evidence.</text>
<rect x="48.0" y="348" width="440.0" height="197" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="390" font-size="22" font-weight="700" style="fill:#1769d2">To verify</text>
<text x="72.0" y="442" font-size="20" font-weight="400" style="fill:#14213a">Keep blockers, hypotheses and open</text>
<text x="72.0" y="471" font-size="20" font-weight="400" style="fill:#14213a">questions visible.</text>
<rect x="512.0" y="348" width="440.0" height="197" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="536.0" y="390" font-size="22" font-weight="700" style="fill:#1769d2">Next step</text>
<text x="536.0" y="442" font-size="20" font-weight="400" style="fill:#14213a">The recipient checks the</text>
<text x="536.0" y="471" font-size="20" font-weight="400" style="fill:#14213a">environment and permissions before</text>
<text x="536.0" y="500" font-size="20" font-weight="400" style="fill:#14213a">accepting.</text>
</svg>
