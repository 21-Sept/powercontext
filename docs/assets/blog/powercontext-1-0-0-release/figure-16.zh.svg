<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="482" viewBox="0 0 1000 482" lang="zh" role="img" aria-labelledby="title"><title id="title">从这里继续</title><rect width="1000" height="482" rx="18" fill="#f7f5ef"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213a}</style>
<text x="48" y="43" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext</text>
<text x="48" y="88" font-size="30" font-weight="700" style="fill:#14213a">从这里继续</text>
<rect x="48.0" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">已验证</text>
<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">明确结论与支持它的证</text>
<text x="72.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">据。</text>
<rect x="357.3333333333333" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="381.3333333333333" y="198" font-size="22" font-weight="700" style="fill:#1769d2">待解决</text>
<text x="381.3333333333333" y="250" font-size="20" font-weight="400" style="fill:#14213a">开放问题保持可见，不</text>
<text x="381.3333333333333" y="279" font-size="20" font-weight="400" style="fill:#14213a">写成已完成。</text>
<rect x="666.6666666666666" y="156" width="285.3333333333333" height="226" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="690.6666666666666" y="198" font-size="22" font-weight="700" style="fill:#1769d2">下一步</text>
<text x="690.6666666666666" y="250" font-size="20" font-weight="400" style="fill:#14213a">人或 Agent 核对当前状</text>
<text x="690.6666666666666" y="279" font-size="20" font-weight="400" style="fill:#14213a">态，再继续工作。</text>
