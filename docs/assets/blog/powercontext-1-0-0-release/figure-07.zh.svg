<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="674" viewBox="0 0 1000 674" lang="zh" role="img" aria-labelledby="title"><title id="title">保留来源与可信边界</title><rect width="1000" height="674" rx="18" fill="#f7f5ef"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213a}</style>
<text x="48" y="43" font-size="18" font-weight="700" style="fill:#1769d2">PowerContext</text>
<text x="48" y="88" font-size="30" font-weight="700" style="fill:#14213a">保留来源与可信边界</text>
<rect x="48.0" y="156" width="440.0" height="197" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">来源</text>
<text x="72.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">保留原始证据及引用，不把猜测当事实</text>
<text x="72.0" y="279" font-size="20" font-weight="400" style="fill:#14213a">。</text>
<rect x="512.0" y="156" width="440.0" height="197" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="536.0" y="198" font-size="22" font-weight="700" style="fill:#1769d2">范围</text>
<text x="536.0" y="250" font-size="20" font-weight="400" style="fill:#14213a">限定项目、环境和适用条件。</text>
<rect x="48.0" y="377" width="440.0" height="197" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="72.0" y="419" font-size="22" font-weight="700" style="fill:#1769d2">版本</text>
<text x="72.0" y="471" font-size="20" font-weight="400" style="fill:#14213a">修订与退役保留历史。</text>
<rect x="512.0" y="377" width="440.0" height="197" rx="14" fill="white" stroke="#cbd3dc"/>
<text x="536.0" y="419" font-size="22" font-weight="700" style="fill:#1769d2">审核</text>
<text x="536.0" y="471" font-size="20" font-weight="400" style="fill:#14213a">复用为经验或技能前，审核做法与证据</text>
<text x="536.0" y="500" font-size="20" font-weight="400" style="fill:#14213a">。</text>
</svg>
